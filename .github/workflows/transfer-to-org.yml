name: Transfer to villa-market org

on:
  workflow_dispatch:
  push:
    paths:
      - .transfer-to-org-trigger

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Check token scopes
        run: |
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/thanakijwanavit/villa-app-reviews-report | jq '{full_name, permissions}'
      - name: Transfer repository to villa-market (temp name)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/thanakijwanavit/villa-app-reviews-report/transfer" \
            -f new_owner=villa-market \
            -f new_name=villa-app-reviews-report-transferred
