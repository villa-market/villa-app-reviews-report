<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villa reviews — triage inbox</title>
<meta name="description" content="Villa Market shopper-app store reviews: reply queue, fix queue and the full review inbox.">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css">
</head>
<body>
<a class="skip" href="#list">Skip to reviews</a>

<header class="hdr">
  <span class="mark" aria-hidden="true">V</span>
  <h1>Villa reviews</h1>
  <p class="hdr-meta" id="hdrMeta">Loading…</p>
</header>

<main class="app" id="app" data-queue="need-reply">

  <!-- LEFT: queues (horizontal segment scroller on mobile) -->
  <nav class="rail" id="rail" aria-label="Queues">
    <p class="rail-label">Queues</p>
    <button type="button" class="q" data-queue="need-reply" aria-current="page">
      <span>Need reply</span><span class="q-n" id="nNeed">–</span>
    </button>
    <button type="button" class="q" data-queue="fix">
      <span>Fix</span><span class="q-n" id="nFix">–</span>
    </button>
    <button type="button" class="q" data-queue="all">
      <span>All reviews</span><span class="q-n" id="nAll">–</span>
    </button>
    <button type="button" class="q" data-queue="overview">
      <span>Overview</span><span class="q-n q-n-none" aria-hidden="true"></span>
    </button>
    <p class="rail-foot">Drafts live on this board only. Nothing is posted to the App&nbsp;Store or Play&nbsp;Store.</p>
  </nav>

  <!-- CENTER: title + compact filters + full-text cards -->
  <section class="list-pane" aria-labelledby="listTitle">
    <div class="list-head">
      <h2 class="list-title" id="listTitle">Need reply</h2>
      <p class="list-sub" id="listSub">Loading reviews…</p>
      <div class="filters">
        <label class="search">
          <span class="sr">Search reviews</span>
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="search" id="fSearch" placeholder="Search review text or author" autocomplete="off" spellcheck="false">
        </label>
        <div class="selects">
          <span class="sel"><label class="sr" for="fPlatform">Platform</label>
            <select id="fPlatform">
              <option value="all">Platform</option>
              <option value="ios">iOS</option>
              <option value="android">Android</option>
            </select>
          </span>
          <span class="sel"><label class="sr" for="fCountry">Country</label>
            <select id="fCountry"><option value="all">Country</option></select>
          </span>
          <span class="sel"><label class="sr" for="fStars">Rating</label>
            <select id="fStars">
              <option value="all">Rating</option>
              <option value="1">1 star</option>
              <option value="2">2 stars</option>
              <option value="3">3 stars</option>
              <option value="4">4 stars</option>
              <option value="5">5 stars</option>
            </select>
          </span>
        </div>
      </div>
      <div class="list-status">
        <p class="count" id="resultCount" aria-live="polite">—</p>
        <button type="button" class="linkbtn" id="clearFilters" hidden>Clear filters</button>
      </div>
    </div>
    <div class="list" id="list" tabindex="-1"></div>
  </section>

  <!-- RIGHT: detail (full-screen sheet on mobile) -->
  <section class="detail" id="detail" aria-label="Review detail">
    <div class="detail-bar">
      <button type="button" class="backbtn" id="backBtn">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false"><path d="M9.5 3 5 8l4.5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </section>

  <!-- OVERVIEW -->
  <section class="overview" id="overview" aria-label="Overview" hidden></section>

</main>

<footer class="foot">
  <span id="footNote">Suggested replies are drafts — nothing is sent from this board.</span>
  <span class="foot-links">
    <a href="../dashboard/">Pulse</a>
    <a href="../dashboard/bugs.html">Bug follow-up</a>
    <a href="../data/reviews.json">reviews.json</a>
  </span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="board.js"></script>
</body>
</html>
